version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    rebase-strategy: auto
    reviewers:
      - beelzer
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 ships no JS API yet, so `astro check` (Volar) and
      # typescript-eslint can't run on it until TS 7.1. Revisit then.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore'
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    rebase-strategy: auto
    reviewers:
      - beelzer
    labels:
      - ci
    commit-message:
      prefix: 'ci'
      include: scope
